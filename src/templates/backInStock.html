<!doctype html>
<html>
  <body style="margin:0;background:#f5f5f4;font-family:Arial,Helvetica,sans-serif;color:#1c1917;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f4;padding:28px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e7e5e4;border-radius:8px;overflow:hidden;">
            <tr>
              <td style="padding:24px 24px 10px;">
                <h1 style="margin:0;font-size:24px;line-height:1.25;color:#111827;">Back in stock</h1>
                <p style="margin:10px 0 0;color:#57534e;font-size:15px;line-height:1.6;">
                  Good news. {{productName}} is available again.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:10px 24px 0;">
                <img src="{{productImage}}" alt="{{productName}}" style="display:block;width:100%;max-height:320px;object-fit:cover;border-radius:8px;border:1px solid #e7e5e4;" />
              </td>
            </tr>
            <tr>
              <td style="padding:22px 24px 28px;">
                <p style="margin:0 0 18px;color:#57534e;font-size:14px;line-height:1.6;">The variant you asked about is ready to order while stock lasts.</p>
                <a href="{{productUrl}}" style="display:inline-block;background:#111827;color:#ffffff;text-decoration:none;border-radius:999px;padding:12px 20px;font-weight:700;font-size:14px;">View product</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
